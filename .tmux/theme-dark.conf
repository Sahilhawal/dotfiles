### --- TokyoNight Storm (dark) theme ---
# Blue session badge, yellow/orange active window/pane accent.
set -g @theme "dark"

# Background comes from the terminal (iTerm preset), not tmux.
set -g window-style 'default'
set -g window-active-style 'default'

# --- status bar ---
set -g status on
set -g status-justify left
set -g status-style "bg=#1f2335,fg=#c0caf5"
set -g status-left-length 40
set -g status-right-length 60

# Session badge (blue block, dark bold)
set -g status-left "#[fg=#1a1b26 bg=#7aa2f7 bold] #S #[fg=#7aa2f7 bg=#1f2335] "

# Windows
set -g window-status-separator ""
set -g window-status-format "#[fg=#828bb8 bg=#1f2335]  #I #{=18:window_name}  "
set -g window-status-current-format "#[fg=#1a1b26 bg=#ff9e64 bold]  #I #{=18:window_name}  #[default]"

# Clock + date (defined date block, blue time block)
set -g status-right "#[fg=#c0caf5 bg=#292e42] %a %d %b  #[fg=#1a1b26 bg=#7aa2f7 bold] %H:%M #[default]"

# --- panes ---
set -g pane-border-status top
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#e0af68"
set -g pane-border-format "#{?pane_active,#[fg=#1a1b26 bg=#e0af68 bold] #P  #{=40:pane_title} #[default],#[fg=#565f89] #P  #{=40:pane_title} }"
