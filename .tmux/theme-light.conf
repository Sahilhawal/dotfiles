### --- Catppuccin Latte (light) theme ---
# Pairs with the "Catppuccin Latte" iTerm preset.
# Blue session badge, peach (orange) active window/pane accent.
set -g @theme "light"

# Background comes from the terminal (iTerm preset), not tmux.
set -g window-style 'default'
set -g window-active-style 'default'

# --- status bar ---
set -g status on
set -g status-justify left
set -g status-style "bg=#dce0e8,fg=#4c4f69"
set -g status-left-length 40
set -g status-right-length 60

# Session badge (blue block, white bold)
set -g status-left "#[fg=#eff1f5 bg=#1e66f5 bold] #S #[fg=#1e66f5 bg=#dce0e8] "

# Windows
set -g window-status-separator ""
set -g window-status-format "#[fg=#5c5f77 bg=#dce0e8]  #I #{=18:window_name}  "
set -g window-status-current-format "#[fg=#eff1f5 bg=#fe640b bold]  #I #{=18:window_name}  #[default]"

# Clock + date (defined date block, blue time block)
set -g status-right "#[fg=#4c4f69 bg=#bcc0cc] %a %d %b  #[fg=#eff1f5 bg=#1e66f5 bold] %H:%M #[default]"

# --- panes ---
set -g pane-border-status top
set -g pane-border-style "fg=#bcc0cc"
set -g pane-active-border-style "fg=#fe640b"
set -g pane-border-format "#{?pane_active,#[fg=#eff1f5 bg=#fe640b bold] #P  #{=40:pane_title} #[default],#[fg=#8c8fa1] #P  #{=40:pane_title} }"
