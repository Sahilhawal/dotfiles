### --- tmux theme (dark/light) ---
# Dark  = TokyoNight Storm   (~/.tmux/theme-dark.conf)
# Light = Catppuccin Latte   (~/.tmux/theme-light.conf)
# Default to light on startup; toggle anytime with prefix + T.
run-shell 'tmux source-file ~/.tmux/theme-$(tmux show -gqv @theme 2>/dev/null || echo light).conf'

bind T run-shell 'bash ~/scripts/tmux-theme-toggle'

