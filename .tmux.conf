### Set prefix key to Ctrl-a (instead of default Ctrl-b)
### Set prefix key to Ctrl-Space (instead of default Ctrl-b)
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

### Use vim keybindings in copy mode
setw -g mode-keys vi

### Enable mouse support
set -g mouse on

### Better splits
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

### Allow faster command sequences
set -s escape-time 0

### Set history limit
set -g history-limit 100000

### Set default shell (optional)
# set-option -g default-shell /bin/zsh

### Status bar customization
set -g status-interval 5


### Pane navigation using Alt + hjkl (no prefix needed)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

### Pane navigation using prefix + hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

### Resize panes with Ctrl + arrow keys
bind -n C-Left resize-pane -L 5
bind -n C-Right resize-pane -R 5
bind -n C-Up resize-pane -U 5
bind -n C-Down resize-pane -D 5

### Reload config
bind r source-file ~/.tmux.conf \; display-message "Reloaded!"


bind-key C-p switch-client -l

### Keep session list cache fresh (used by the floating picker)
set-hook -g session-created "run-shell 'bash ~/scripts/tmux-session-cache-refresh'"
set-hook -g session-closed  "run-shell 'bash ~/scripts/tmux-session-cache-refresh'"
set-hook -g session-renamed "run-shell 'bash ~/scripts/tmux-session-cache-refresh'"

### Floating session picker (prefix + f) — press 1-9 to instantly jump+select
bind f display-popup -w 60% -h 40% -E "bash ~/scripts/tmux-session-picker"
### Floating project picker (prefix + p) — browse ~/code projects, open/switch session
bind p display-popup -w 60% -h 50% -E "bash ~/scripts/tmux-project-picker"
### Floating Claude agent picker (prefix + a) — all claude windows with status
bind a display-popup -w 35% -h 25% -E "bash ~/scripts/tmux-claude-picker"
### Floating port-status picker (prefix + P) — tracked dev ports, active/inactive, kill
bind P display-popup -w 70% -h 45% -E "bash ~/scripts/tmux-port-picker"
### Clipboard integration (macOS and WSL)
# macOS:
# bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy"
# WSL:
# bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "clip.exe"

### Colors
set -g default-terminal "tmux-256color"

set-option -g base-index 1

set-option -g pane-base-index 1


set -g status-interval 2
set -g status-left-length 30
set -g status-right-length 100

